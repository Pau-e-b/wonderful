<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Camera Test</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #camera {
      position: fixed;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #cascata {
      position: fixed;
      width: 75%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    #start {
      position: fixed;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%);
      padding: 14px 20px;
      font-size: 17px;
      z-index: 10;
    }
  </style>
</head>

<body>

  <video id="camera" autoplay playsinline muted></video>

  <img id="cascata" src="cascate.png">

  <button id="start">Apri fotocamera</button>

  <script>
    const video = document.getElementById("camera");
    const button = document.getElementById("start");

    button.addEventListener("click", async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" }
          },
          audio: false
        });

        video.srcObject = stream;
        button.style.display = "none";

      } catch (error) {
        alert("Impossibile aprire la fotocamera: " + error.message);
      }
    });
  </script>

</body>
</html>
