<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balena AR Test</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #camera {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    #whale {
      position: fixed;
      top: -20%;
      left: -300%;
      width: 330%;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      mix-blend-mode: screen;
    }

    #whale.show {
      opacity: 1;
      animation: attraversa 25s linear forwards;
    }

    @keyframes attraversa {
      from {
        left: -300%;
      }

      to {
        left: 110%;
      }
    }

    #start {
      position: fixed;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%);
      padding: 14px 20px;
      font-size: 17px;
      z-index: 10;
    }
  </style>
</head>

<body>

  <video id="camera" autoplay playsinline muted></video>

  <video id="whale" muted loop playsinline preload="auto">
    <source src="balena_ok.mp4" type="video/mp4">
  </video>

  <button id="start">Apri fotocamera</button>

  <script>
    const camera = document.getElementById("camera");
    const whale = document.getElementById("whale");
    const start = document.getElementById("start");

    start.addEventListener("click", async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" }
          },
          audio: false
        });

        camera.srcObject = stream;
        start.style.display = "none";

        whale.currentTime = 0;

        try {
          await whale.play();
        } catch (e) {
          console.log("Errore avvio balena:", e);
        }

        setTimeout(() => {
          whale.classList.add("show");
        }, 2500);

      } catch (error) {
        alert("Impossibile aprire la fotocamera: " + error.message);
      }
    });
  </script>

</body>
</html>
